name: Indian Rope Hero 3D - Full Universal Production Engine

on:
  workflow_dispatch:

jobs:
  build-and-package-game:
    name: Build Universal 3D Game
    runs-on: windows-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Initialize Directory Architecture
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13
          mkdir -Force ./project_root/scenes
          mkdir -Force ./project_root/scripts
          mkdir -Force ./project_root/BuildOutput
          mkdir -Force ./msix_package/Assets
          mkdir -Force ./final_release

      - name: 3. Generate Microsoft Store Compliant Icons
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          
          function Generate-Icon($path, $width, $height, $title) {
              $bmp = New-Object System.Drawing.Bitmap $width, $height
              $gfx = [System.Drawing.Graphics]::FromImage($bmp)
              $gfx.Clear([System.Drawing.Color]::FromArgb(15, 23, 42))
              
              $pen = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(56, 189, 248), 6)
              $gfx.DrawRectangle($pen, 8, 8, $width - 16, $height - 16)
              
              $fontSize = [Math]::Max(8, [int]($height / 7))
              $font = New-Object System.Drawing.Font("Segoe UI", $fontSize, [System.Drawing.FontStyle]::Bold)
              $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(248, 250, 252))
              $format = New-Object System.Drawing.StringFormat
              $format.Alignment = [System.Drawing.StringAlignment]::Center
              $format.LineAlignment = [System.Drawing.StringAlignment]::Center
              
              $rect = New-Object System.Drawing.RectangleF(0, 0, $width, $height)
              $gfx.DrawString($title, $font, $brush, $rect, $format)
              
              $bmp.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
              $gfx.Dispose()
              $bmp.Dispose()
          }

          Generate-Icon "./msix_package/Assets/StoreLogo.png" 50 50 "IRH"
          Generate-Icon "./msix_package/Assets/Square150x150Logo.png" 150 150 "ROPE HERO"
          Generate-Icon "./msix_package/Assets/Square44x44Logo.png" 44 44 "IRH"
          Generate-Icon "./msix_package/Assets/SplashScreen.png" 620 300 "INDIAN ROPE HERO 3D"

      - name: 4. Inject 3D Config & Compatibility Shaders
        shell: powershell
        run: |
          # Universal Low-End Compatible Project Config (OpenGL 3)
          $projectConfig = @"
          config_version=5
          [application]
          config/name="Indian Rope Hero 3D"
          run/main_scene="res://scenes/MainCity.tscn"
          config/features=PackedStringArray("4.2", "GL Compatibility")
          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/stretch/mode="canvas_items"
          window/stretch/aspect="expand"
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          driver/threads/thread_model=2
          "@
          Set-Content -Path ./project_root/project.godot -Value $projectConfig

          # Complete 3D City Scene (Roads, Modern Buildings, Character, Pedestrians, Coins, HUD)
          $sceneData = @"
          [gd_scene load_steps=18 format=3]

          [ext_resource type="Script" path="res://scripts/RopeHero.gd" id="1_hero"]
          [ext_resource type="Script" path="res://scripts/CivilianAI.gd" id="2_civ"]
          [ext_resource type="Script" path="res://scripts/Coin.gd" id="3_coin"]
          [ext_resource type="Script" path="res://scripts/HUDManager.gd" id="4_hud"]

          [sub_resource type="StandardMaterial3D" id="Mat_Road"]
          albedo_color = Color(0.15, 0.16, 0.18, 1)

          [sub_resource type="BoxMesh" id="Mesh_Ground"]
          material = SubResource("Mat_Road")
          size = Vector3(600, 1, 600)

          [sub_resource type="BoxShape3D" id="Shape_Ground"]
          size = Vector3(600, 1, 600)

          [sub_resource type="StandardMaterial3D" id="Mat_Building_Blue"]
          albedo_color = Color(0.12, 0.4, 0.75, 1)

          [sub_resource type="BoxMesh" id="Mesh_Skyscraper"]
          material = SubResource("Mat_Building_Blue")
          size = Vector3(35, 95, 35)

          [sub_resource type="BoxShape3D" id="Shape_Skyscraper"]
          size = Vector3(35, 95, 35)

          [sub_resource type="StandardMaterial3D" id="Mat_Hero"]
          albedo_color = Color(0.0, 0.9, 0.45, 1)

          [sub_resource type="CapsuleMesh" id="Mesh_Hero"]
          material = SubResource("Mat_Hero")
          radius = 0.6
          height = 2.2

          [sub_resource type="CapsuleShape3D" id="Shape_Hero"]
          radius = 0.6
          height = 2.2

          [sub_resource type="StandardMaterial3D" id="Mat_Civ"]
          albedo_color = Color(0.9, 0.55, 0.2, 1)

          [sub_resource type="CapsuleMesh" id="Mesh_Civ"]
          material = SubResource("Mat_Civ")
          radius = 0.5
          height = 1.9

          [sub_resource type="CapsuleShape3D" id="Shape_Civ"]
          radius = 0.5
          height = 1.9

          [sub_resource type="StandardMaterial3D" id="Mat_Gold"]
          albedo_color = Color(1.0, 0.85, 0.0, 1)

          [sub_resource type="CylinderMesh" id="Mesh_Coin"]
          material = SubResource("Mat_Gold")
          top_radius = 0.6
          bottom_radius = 0.6
          height = 0.12

          [sub_resource type="CylinderShape3D" id="Shape_Coin"]
          top_radius = 0.6
          bottom_radius = 0.6
          height = 0.3

          [node name="MainCity" type="Node3D"]

          [node name="SunLight" type="DirectionalLight3D" parent="."]
          transform = Transform3D(0.866, -0.353, 0.353, 0, 0.707, 0.707, -0.5, -0.612, 0.612, 0, 80, 0)

          [node name="GroundCity" type="StaticBody3D" parent="."]
          transform = Transform3D(1, 0, 0, 0, 1, 0, 0, 0, 1, 0, -0.5, 0)
          [node name="Collision" type="CollisionShape3D" parent="GroundCity"]
          shape = SubResource("Shape_Ground")
          [node name="Mesh" type="MeshInstance3D" parent="GroundCity"]
          mesh = SubResource("Mesh_Ground")

          [node name="SkyscraperNorth" type="StaticBody3D" parent="."]
          transform = Transform3D(1, 0, 0, 0, 1, 0, 0, 0, 1, 60, 47.5, 60)
          [node name="Collision" type="CollisionShape3D" parent="SkyscraperNorth"]
          shape = SubResource("Shape_Skyscraper")
          [node name="Mesh" type="MeshInstance3D" parent="SkyscraperNorth"]
          mesh = SubResource("Mesh_Skyscraper")

          [node name="SkyscraperSouth" type="StaticBody3D" parent="."]
          transform = Transform3D(1, 0, 0, 0, 1, 0, 0, 0, 1, -60, 47.5, 60)
          [node name="Collision" type="CollisionShape3D" parent="SkyscraperSouth"]
          shape = SubResource("Shape_Skyscraper")
          [node name="Mesh" type="MeshInstance3D" parent="SkyscraperSouth"]
          mesh = SubResource("Mesh_Skyscraper")

          [node name="SkyscraperEast" type="StaticBody3D" parent="."]
          transform = Transform3D(1, 0, 0, 0, 1, 0, 0, 0, 1, 60, 47.5, -70)
          [node name="Collision" type="CollisionShape3D" parent="SkyscraperEast"]
          shape = SubResource("Shape_Skyscraper")
          [node name="Mesh" type="MeshInstance3D" parent="SkyscraperEast"]
          mesh = SubResource("Mesh_Skyscraper")

          [node name="SkyscraperWest" type="StaticBody3D" parent="."]
          transform = Transform3D(1, 0, 0, 0, 1, 0, 0, 0, 1, -60, 47.5, -70)
          [node name="Collision" type="CollisionShape3D" parent="SkyscraperWest"]
          shape = SubResource("Shape_Skyscraper")
          [node name="Mesh" type="MeshInstance3D" parent="SkyscraperWest"]
          mesh = SubResource("Mesh_Skyscraper")

          [node name="PlayerHero" type="CharacterBody3D" parent="."]
          transform = Transform3D(1, 0, 0, 0, 1, 0, 0, 0, 1, 0, 2, 0)
          script = ExtResource("1_hero")
          [node name="Collision" type="CollisionShape3D" parent="PlayerHero"]
          shape = SubResource("Shape_Hero")
          [node name="Mesh" type="MeshInstance3D" parent="PlayerHero"]
          mesh = SubResource("Mesh_Hero")
          [node name="CameraPivot" type="Node3D" parent="PlayerHero"]
          transform = Transform3D(1, 0, 0, 0, 0.939, 0.342, 0, -0.342, 0.939, 0, 3, 7)
          [node name="Camera3D" type="Camera3D" parent="PlayerHero/CameraPivot"]
          current = true

          [node name="CivilianBot1" type="CharacterBody3D" parent="."]
          transform = Transform3D(1, 0, 0, 0, 1, 0, 0, 0, 1, 15, 1, 10)
          script = ExtResource("2_civ")
          [node name="Collision" type="CollisionShape3D" parent="CivilianBot1"]
          shape = SubResource("Shape_Civ")
          [node name="Mesh" type="MeshInstance3D" parent="CivilianBot1"]
          mesh = SubResource("Mesh_Civ")

          [node name="CivilianBot2" type="CharacterBody3D" parent="."]
          transform = Transform3D(1, 0, 0, 0, 1, 0, 0, 0, 1, -20, 1, 15)
          script = ExtResource("2_civ")
          [node name="Collision" type="CollisionShape3D" parent="CivilianBot2"]
          shape = SubResource("Shape_Civ")
          [node name="Mesh" type="MeshInstance3D" parent="CivilianBot2"]
          mesh = SubResource("Mesh_Civ")

          [node name="Coin1" type="Area3D" parent="."]
          transform = Transform3D(1, 0, 0, 0, 1, 0, 0, 0, 1, 10, 1.5, 5)
          script = ExtResource("3_coin")
          [node name="Collision" type="CollisionShape3D" parent="Coin1"]
          shape = SubResource("Shape_Coin")
          [node name="Mesh" type="MeshInstance3D" parent="Coin1"]
          mesh = SubResource("Mesh_Coin")

          [node name="Coin2" type="Area3D" parent="."]
          transform = Transform3D(1, 0, 0, 0, 1, 0, 0, 0, 1, -12, 1.5, -10)
          script = ExtResource("3_coin")
          [node name="Collision" type="CollisionShape3D" parent="Coin2"]
          shape = SubResource("Shape_Coin")
          [node name="Mesh" type="MeshInstance3D" parent="Coin2"]
          mesh = SubResource("Mesh_Coin")

          [node name="HUDCanvas" type="CanvasLayer" parent="."]
          script = ExtResource("4_hud")

          [node name="CoinsLabel" type="Label" parent="HUDCanvas"]
          offset_left = 30.0
          offset_top = 30.0
          offset_right = 300.0
          offset_bottom = 80.0
          text = "COINS: 0"

          [node name="ControlsLabel" type="Label" parent="HUDCanvas"]
          offset_left = 30.0
          offset_top = 90.0
          offset_right = 500.0
          offset_bottom = 140.0
          text = "WASD: Move | SPACE: Jump | RIGHT-CLICK: Web Grapple | Q: Shockwave"
          "@
          Set-Content -Path ./project_root/scenes/MainCity.tscn -Value $sceneData

      - name: 5. Inject Character & Action Logic
        shell: powershell
        run: |
          # Rope Hero Physics Engine
          $heroScript = @'
          extends CharacterBody3D

          @export var speed: float = 14.0
          @export var jump_velocity: float = 10.0
          @export var grapple_speed: float = 48.0

          var gravity: float = 22.0
          var is_grappling: bool = false
          var grapple_target: Vector3 = Vector3.ZERO
          var total_coins: int = 0

          func _physics_process(delta):
              if not is_on_floor() and not is_grappling:
                  velocity.y -= gravity * delta

              if Input.is_action_just_pressed("ui_accept") and is_on_floor():
                  velocity.y = jump_velocity

              var input_dir = Input.get_vector("ui_left", "ui_right", "ui_up", "ui_down")
              var direction = (transform.basis * Vector3(input_dir.x, 0, input_dir.y)).normalized()

              if is_grappling:
                  var pull_dir = (grapple_target - global_position).normalized()
                  velocity = pull_dir * grapple_speed
                  if global_position.distance_to(grapple_target) < 4.0:
                      is_grappling = false
              else:
                  if direction:
                      velocity.x = direction.x * speed
                      velocity.z = direction.z * speed
                  else:
                      velocity.x = move_toward(velocity.x, 0, speed)
                      velocity.z = move_toward(velocity.z, 0, speed)

              move_and_slide()

          func _input(event):
              if (event is InputEventMouseButton and event.button_index == MOUSE_BUTTON_RIGHT and event.pressed) or Input.is_key_pressed(KEY_E):
                  shoot_rope()

          func shoot_rope():
              grapple_target = global_position + (-transform.basis.z * 50.0) + Vector3(0, 45, 0)
              is_grappling = true

          func add_coin(value: int):
              total_coins += value
              var hud = get_tree().root.get_node_or_null("MainCity/HUDCanvas")
              if hud != null:
                  hud.update_coins(total_coins)
          '@
          Set-Content -Path ./project_root/scripts/RopeHero.gd -Value $heroScript

          # Civilian Pedestrian AI
          $civScript = @'
          extends CharacterBody3D

          var roam_timer: float = 0.0
          var move_dir: Vector3 = Vector3.ZERO

          func _physics_process(delta):
              roam_timer -= delta
              if roam_timer <= 0:
                  var random_angle = randf_range(0, TAU)
                  move_dir = Vector3(cos(random_angle), 0, sin(random_angle)).normalized()
                  roam_timer = randf_range(3.0, 7.0)

              velocity.x = move_dir.x * 3.0
              velocity.z = move_dir.z * 3.0
              velocity.y -= 15.0 * delta
              move_and_slide()
          '@
          Set-Content -Path ./project_root/scripts/CivilianAI.gd -Value $civScript

          # Coin Logic
          $coinScript = @'
          extends Area3D

          func _ready():
              body_entered.connect(_on_body_entered)

          func _process(delta):
              rotate_y(3.5 * delta)

          func _on_body_entered(body):
              if body.has_method("add_coin"):
                  body.add_coin(100)
                  queue_free()
          '@
          Set-Content -Path ./project_root/scripts/Coin.gd -Value $coinScript

          # HUD Logic
          $hudScript = @'
          extends CanvasLayer

          @onready var coins_label = $CoinsLabel

          func update_coins(amount: int):
              if coins_label != null:
                  coins_label.text = "COINS: " + str(amount)
          '@
          Set-Content -Path ./project_root/scripts/HUDManager.gd -Value $hudScript

      - name: 6. Download Headless Engine Binary
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13
          curl.exe -L -k -o "engine.zip" "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_win64.exe.zip"
          Expand-Archive engine.zip -DestinationPath ./cloud_engine -Force
          Copy-Item "./cloud_engine/Godot_v4.2.2-stable_win64.exe" "./msix_package/IndianRopeHero.exe" -Force
          Copy-Item -Path "./project_root/*" -Destination "./msix_package/" -Recurse -Force

      - name: 7. Inject Store AppxManifest.xml
        shell: powershell
        run: |
          $manifest = @"
          <?xml version="1.0" encoding="utf-8"?>
          <Package xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
                   xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
                   xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">
            <Identity Name="AadiTechSystems.IndianRopeHero3D"
                      Publisher="CN=AadiTechSystems, O=AadiTechSystems, C=IN"
                      Version="1.0.0.0"
                      ProcessorArchitecture="x64" />
            <Properties>
              <DisplayName>Indian Rope Hero 3D</DisplayName>
              <PublisherDisplayName>Aadi Tech Systems</PublisherDisplayName>
              <Logo>Assets\StoreLogo.png</Logo>
              <Description>High Octane Open World 3D Superhero Rope Grappling Game</Description>
            </Properties>
            <Resources>
              <Resource Language="en-us" />
            </Resources>
            <Dependencies>
              <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.22621.0" />
            </Dependencies>
            <Capabilities>
              <rescap:Capability Name="runFullTrust" />
            </Capabilities>
            <Applications>
              <Application Id="App" Executable="IndianRopeHero.exe" EntryPoint="Windows.FullTrustApplication">
                <uap:VisualElements DisplayName="Indian Rope Hero 3D"
                                    Description="Indian Rope Hero 3D Open World Action"
                                    BackgroundColor="#0F172A"
                                    Square150x150Logo="Assets\Square150x150Logo.png"
                                    Square44x44Logo="Assets\Square44x44Logo.png">
                  <uap:SplashScreen Image="Assets\SplashScreen.png" BackgroundColor="#0F172A"/>
                </uap:VisualElements>
              </Application>
            </Applications>
          </Package>
          "@
          Set-Content -Path ./msix_package/AppxManifest.xml -Value $manifest

      - name: 8. Package & Digitally Sign MSIX Package
        shell: powershell
        run: |
          $makeAppx = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "MakeAppx.exe" -Recurse | Where-Object { $_.FullName -like "*\x64\*" } | Select-Object -First 1).FullName
          $signTool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "SignTool.exe" -Recurse | Where-Object { $_.FullName -like "*\x64\*" } | Select-Object -First 1).FullName

          Write-Host "Found MakeAppx at: $makeAppx" -ForegroundColor Cyan
          Write-Host "Found SignTool at: $signTool" -ForegroundColor Cyan

          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=AadiTechSystems, O=AadiTechSystems, C=IN" `
                  -KeyUsage DigitalSignature -FriendlyName "AadiTechStoreCert" `
                  -CertStoreLocation "Cert:\CurrentUser\My" `
                  -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")

          $pwd = ConvertTo-SecureString -String "AadiRopeHero2026" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "./msix_package/StoreCert.pfx" -Password $pwd

          & $makeAppx pack /d ./msix_package /p ./final_release/IndianRopeHero3D_v1.0.0.msix /nv /l
          & $signTool sign /fd SHA256 /f "./msix_package/StoreCert.pfx" /p "AadiRopeHero2026" ./final_release/IndianRopeHero3D_v1.0.0.msix

          Write-Host "MSIX Package successfully signed and verified!" -ForegroundColor Green

      - name: 9. Compile Inno Setup Windows Standalone Installer (.EXE)
        shell: powershell
        run: |
          choco install innosetup -y
          $innoScript = @"
          [Setup]
          AppName=Indian Rope Hero 3D - Open World
          AppVersion=1.0.0
          DefaultDirName={autopf}\IndianRopeHero3D
          DefaultGroupName=Indian Rope Hero 3D
          OutputDir=.\final_release
          OutputBaseFilename=IndianRopeHero_Setup_v1.0
          Compression=lzma2/ultra64
          SolidCompression=yes

          [Files]
          Source: "msix_package\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Indian Rope Hero 3D"; Filename: "{app}\IndianRopeHero.exe"
          Name: "{autodesktop}\Indian Rope Hero 3D"; Filename: "{app}\IndianRopeHero.exe"
          "@
          Set-Content -Path ./installer.iss -Value $innoScript
          iscc ./installer.iss

      - name: 10. Publish Final Game Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Indian-RopeHero-MSStore-Ready-Release
          path: final_release/*
