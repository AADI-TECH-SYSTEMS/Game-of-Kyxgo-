name: Indian Rope Hero 3D - Standalone Cloud Game Engine

on:
  workflow_dispatch:

jobs:
  build-and-compile:
    name: Cloud Compile 3D Game & Setup
    runs-on: windows-latest

    steps:
      - name: 1. Checkout Existing Repo Code
        uses: actions/checkout@v4

      - name: 2. Setup Build Directories
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13
          mkdir -Force ./project_root/scenes
          mkdir -Force ./project_root/scripts
          mkdir -Force ./project_root/BuildOutput
          mkdir -Force ./final_release

      - name: 3. Inject 3D Game Config & City Scene
        shell: powershell
        run: |
          $projectConfig = @"
          config_version=5
          [application]
          config/name="Indian Rope Hero 3D"
          run/main_scene="res://scenes/MainCity.tscn"
          config/features=PackedStringArray("4.2", "Forward Plus")
          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/stretch/mode="canvas_items"
          [physics]
          3d/default_gravity=18.0
          "@
          Set-Content -Path ./project_root/project.godot -Value $projectConfig

          $sceneData = @"
          [gd_scene load_steps=6 format=3]

          [ext_resource type="Script" path="res://scripts/RopeHero.gd" id="1_hero"]

          [sub_resource type="BoxShape3D" id="BoxShape3D_ground"]
          size = Vector3(200, 1, 200)

          [sub_resource type="StandardMaterial3D" id="Mat_ground"]
          albedo_color = Color(0.2, 0.25, 0.2, 1)

          [sub_resource type="BoxMesh" id="BoxMesh_ground"]
          material = SubResource("Mat_ground")
          size = Vector3(200, 1, 200)

          [sub_resource type="CapsuleShape3D" id="CapsuleShape3D_player"]
          radius = 0.5
          height = 2.0

          [sub_resource type="CapsuleMesh" id="CapsuleMesh_player"]
          radius = 0.5
          height = 2.0

          [node name="MainCity" type="Node3D"]

          [node name="DirectionalLight3D" type="DirectionalLight3D" parent="."]
          transform = Transform3D(0.866025, -0.353553, 0.353553, 0, 0.707107, 0.707107, -0.5, -0.612372, 0.612372, 0, 30, 0)
          shadow_enabled = true

          [node name="GroundCity" type="StaticBody3D" parent="."]
          transform = Transform3D(1, 0, 0, 0, 1, 0, 0, 0, 1, 0, -0.5, 0)

          [node name="CollisionShape3D" type="CollisionShape3D" parent="GroundCity"]
          shape = SubResource("BoxShape3D_ground")

          [node name="MeshInstance3D" type="MeshInstance3D" parent="GroundCity"]
          mesh = SubResource("BoxMesh_ground")

          [node name="PlayerHero" type="CharacterBody3D" parent="."]
          transform = Transform3D(1, 0, 0, 0, 1, 0, 0, 0, 1, 0, 2, 0)
          script = ExtResource("1_hero")

          [node name="CollisionShape3D" type="CollisionShape3D" parent="PlayerHero"]
          shape = SubResource("CapsuleShape3D_player")

          [node name="MeshInstance3D" type="MeshInstance3D" parent="PlayerHero"]
          mesh = SubResource("CapsuleMesh_player")

          [node name="CameraPivot" type="Node3D" parent="PlayerHero"]
          transform = Transform3D(1, 0, 0, 0, 0.939693, 0.34202, 0, -0.34202, 0.939693, 0, 2, 5)

          [node name="Camera3D" type="Camera3D" parent="PlayerHero/CameraPivot"]
          current = true
          "@
          Set-Content -Path ./project_root/scenes/MainCity.tscn -Value $sceneData

      - name: 4. Inject Rope Hero Logic Engine
        shell: powershell
        run: |
          $gdscript = @'
          extends CharacterBody3D

          @export var speed: float = 10.0
          @export var jump_velocity: float = 8.0
          @export var grapple_speed: float = 35.0

          var gravity = 18.0
          var is_grappling: bool = false
          var grapple_target: Vector3 = Vector3.ZERO
          var total_coins: int = 0

          func _physics_process(delta):
              if not is_on_floor() and not is_grappling:
                  velocity.y -= gravity * delta

              if Input.is_action_just_pressed("ui_accept") and is_on_floor():
                  velocity.y = jump_velocity

              var input_dir = Input.get_vector("ui_left", "ui_right", "ui_up", "ui_down")
              var direction = (transform.basis * Vector3(input_dir.x, 0, input_dir.y)).normalized()

              if is_grappling:
                  var pull_dir = (grapple_target - global_position).normalized()
                  velocity = pull_dir * grapple_speed
                  if global_position.distance_to(grapple_target) < 3.0:
                      is_grappling = false
              else:
                  if direction:
                      velocity.x = direction.x * speed
                      velocity.z = direction.z * speed
                  else:
                      velocity.x = move_toward(velocity.x, 0, speed)
                      velocity.z = move_toward(velocity.z, 0, speed)

              move_and_slide()

          func _input(event):
              if event is InputEventMouseButton and event.button_index == MOUSE_BUTTON_RIGHT and event.pressed:
                  shoot_rope()

          func shoot_rope():
              var target_pos = global_position + (-transform.basis.z * 30.0) + Vector3(0, 15, 0)
              grapple_target = target_pos
              is_grappling = true
          '@
          Set-Content -Path ./project_root/scripts/RopeHero.gd -Value $gdscript

      - name: 5. Fetch Headless Engine Core
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13
          curl.exe -L -k -o "engine.zip" "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_win64.exe.zip"
          Expand-Archive engine.zip -DestinationPath ./cloud_engine -Force

      - name: 6. Bind Executable Binary
        shell: powershell
        run: |
          Copy-Item "./cloud_engine/Godot_v4.2.2-stable_win64.exe" "./project_root/BuildOutput/IndianRopeHero.exe" -Force

      - name: 7. Package Inno Setup Installer
        shell: powershell
        run: |
          choco install innosetup -y
          $innoScript = @"
          [Setup]
          AppName=Indian Rope Hero 3D
          AppVersion=1.0.0
          DefaultDirName={autopf}\IndianRopeHero3D
          DefaultGroupName=Indian Rope Hero 3D
          OutputDir=.\final_release
          OutputBaseFilename=IndianRopeHero_Setup_v1.0
          Compression=lzma2/ultra64
          SolidCompression=yes

          [Files]
          Source: "project_root\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Indian Rope Hero 3D"; Filename: "{app}\BuildOutput\IndianRopeHero.exe"
          Name: "{autodesktop}\Indian Rope Hero 3D"; Filename: "{app}\BuildOutput\IndianRopeHero.exe"
          "@
          Set-Content -Path ./installer.iss -Value $innoScript
          iscc ./installer.iss

      - name: 8. Publish Game Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Indian-Rope-Hero-3D-Playable-Game
          path: final_release/IndianRopeHero_Setup_v1.0.exe
