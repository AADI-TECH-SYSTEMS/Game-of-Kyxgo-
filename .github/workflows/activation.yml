name: Unity License Activation Request

on:
  workflow_dispatch:

jobs:
  acquire-activation-file:
    name: Generate .alf File
    runs-on: ubuntu-latest
    container:
      image: unityci/editor:ubuntu-2022.3.20f1-base-3
    steps:
      - name: Request Activation File (.alf)
        run: |
          unity-editor \
            -nographics \
            -batchmode \
            -createManualActivationFile \
            -logfile /dev/stdout || true
          
          # Find and move generated .alf file to root
          find / -name "*.alf" -exec cp {} ./Unity_Activation.alf \; 2>/dev/null || true
          ls -la Unity_Activation.alf

      - name: Upload ALF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityActivationFile
          path: Unity_Activation.alf
          
